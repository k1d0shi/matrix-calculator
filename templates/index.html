<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>MATRIXa</title>

    <!-- Шрифт для логотипа -->
    <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>

        /* ---- Градиентная кнопка и select ---- */
        .gradient-btn {
            background-image: linear-gradient(to right top, #051937, #004d7a, #008793, #00bf72, #a8eb12);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            transition: 0.25s;
        }
        .gradient-btn:hover {
            opacity: 0.85;
        }
        .gradient-select {
            background-image: linear-gradient(to right top, #051937, #004d7a, #008793, #00bf72, #a8eb12);
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 5px;
            font-weight: 600;
            cursor: pointer;
        }

        /* ---- Стили решения ---- */
        .result-container {
            width: 80%;
            margin: 20px auto;
            text-align: center;
        }
        .solution-toggle {
            display: inline-block;
            margin: 12px 0;
            cursor: pointer;
            color: #ffffff;
            background: #4CAF50;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: 600;
        }
        .solution-panel {
            width: 100%;
            max-width: 900px;
            margin: 10px auto 0;
            text-align: left;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
            display: none;
            background: #fafafa;
        }
        .solution-panel ol {
            margin: 0;
            padding-left: 20px;
        }
        .solution-panel li {
            margin: 6px 0;
            line-height: 1.4;
        }
        table.result-table {
            margin: 12px auto;
            border-collapse: collapse;
        }
        table.result-table td {
            border: 1px solid #444;
            padding: 8px 14px;
            font-size: 16px;
        }

        /* ---- НОВЫЕ СТИЛИ ШАПКИ ---- */
        header {
            width: 100%;
            padding: 25px 40px;
            background-image: linear-gradient(to right, #1e7a32, #8fe33a);
            display: flex;
            justify-content: flex-start;
            align-items: center;
        }
        .logo-title {
            font-family: 'Alfa Slab One', serif;
            font-size: 90px;
            color: white;
            letter-spacing: 3px;
            margin: 0;
            text-transform: uppercase;
            text-shadow: 0 3px 5px rgba(0,0,0,0.3);
        }

    </style>
</head>
<body>

<header>
    <h1 class="logo-title">MATRIXa</h1>
</header>

<main>

    <div class="matrix-container" style="display:flex; justify-content:space-between; align-items:center; width:80%; margin:20px auto; position:relative;">

        <div class="matrix left-matrix">
            <h2>Матрица A</h2>
            <label>Размер:
                <select id="sizeA" onchange="generateMatrix('A')" class="gradient-select">
                    <option value="2">2x2</option>
                    <option value="3" selected>3x3</option>
                    <option value="4">4x4</option>
                </select>
            </label>
            <div id="matrixA"></div>
        </div>

        <button onclick="swapMatrices()" class="swap-button"
                style="position:absolute; left:50%; top:45%; transform:translate(-50%, -50%); font-size:30px; width:70px; height:70px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; padding:0;">
            🔁
        </button>

        <div class="matrix right-matrix">
            <h2>Матрица B</h2>
            <label>Размер:
                <select id="sizeB" onchange="generateMatrix('B')" class="gradient-select">
                    <option value="2">2x2</option>
                    <option value="3" selected>3x3</option>
                    <option value="4">4x4</option>
                </select>
            </label>
            <div id="matrixB"></div>
        </div>
    </div>

    <div class="operation" style="text-align:center; margin-top:10px;">
        <label>Операция:
            <select id="operation" class="gradient-select">
                <option value="add">A + B (сложение)</option>
                <option value="sub">A - B (вычитание)</option>
                <option value="mul">A × B (умножение)</option>
                <option value="transposeA">Aᵀ (транспонирование A)</option>
                <option value="transposeB">Bᵀ (транспонирование B)</option>
                <option value="rankA">Ранг (A)</option>
                <option value="rankB">Ранг (B)</option>
                <option value="detA">det(A)</option>
                <option value="detB">det(B)</option>
                <option value="invA">A⁻¹ (обратная A)</option>
                <option value="invB">B⁻¹ (обратная B)</option>
            </select>
        </label>

        <button onclick="calculate()" class="gradient-btn">Вычислить</button>
    </div>

    <div id="resultArea" class="result-container"></div>
</main>


<script>

    /* --- Генерация матриц --- */
    function generateMatrix(id) {
        const size = parseInt(document.getElementById("size" + id).value);
        const container = document.getElementById("matrix" + id);
        container.innerHTML = "";
        for (let i = 0; i < size; i++) {
            const row = document.createElement("div");
            row.classList.add("row");
            for (let j = 0; j < size; j++) {
                const input = document.createElement("input");
                input.type = "number";
                input.value = "0";
                input.classList.add("cell");
                input.style.width = "60px";
                input.style.height = "36px";
                input.style.margin = "4px";
                input.style.textAlign = "center";
                row.appendChild(input);
            }
            container.appendChild(row);
        }
        enableAutoSelect();
    }

    /* --- Получение матрицы --- */
    function getMatrix(id) {
        const inputs = document.querySelectorAll(`#matrix${id} input`);
        const size = Math.sqrt(inputs.length);
        const matrix = [];
        for (let i = 0; i < size; i++) {
            const row = [];
            for (let j = 0; j < size; j++) {
                const value = parseFloat(inputs[i * size + j].value);
                row.push(isNaN(value) ? 0 : value);
            }
            matrix.push(row);
        }
        return matrix;
    }

    /* --- Поменять местами матрицы --- */
    function swapMatrices() {
        const aInputs = document.querySelectorAll("#matrixA input");
        const bInputs = document.querySelectorAll("#matrixB input");
        if (aInputs.length !== bInputs.length) {
            alert("Матрицы должны быть одинакового размера!");
            return;
        }
        for (let i = 0; i < aInputs.length; i++) {
            [aInputs[i].value, bInputs[i].value] = [bInputs[i].value, aInputs[i].value];
        }

        const sa = document.getElementById("sizeA");
        const sb = document.getElementById("sizeB");
        [sa.value, sb.value] = [sb.value, sa.value];
    }

    /* --- Вычисления --- */
    async function calculate() {
        const A = getMatrix("A");
        const B = getMatrix("B");
        const operation = document.getElementById("operation").value;

        const resultArea = document.getElementById("resultArea");
        resultArea.innerHTML = "<p>Вычисляем...</p>";

        try {
            const response = await fetch("/calculate", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({A, B, operation})
            });

            const data = await response.json();
            if (data.error) {
                resultArea.innerHTML = `<p class="error-text">${data.error}</p>`;
                return;
            }

            let html = `
                <button id="toggleSolution" class="solution-toggle">Посмотреть решение</button>
                <div id="resultBox">
                    <h3>Результат:</h3>
                    <table class="result-table">`;

            data.result.forEach(row => {
                html += "<tr>" + row.map(c => `<td>${c}</td>`).join("") + "</tr>";
            });

            html += `
                    </table>
                </div>
                <div id="solutionPanel" class="solution-panel">
                    <h4>Пошаговое решение:</h4>
                    <ol>`;

            data.steps.forEach(step => {
                html += `<li>${String(step)}</li>`;
            });

            html += `
                    </ol>
                </div>`;

            resultArea.innerHTML = html;

            const toggleBtn = document.getElementById("toggleSolution");
            const panel = document.getElementById("solutionPanel");
            toggleBtn.onclick = () => {
                panel.style.display =
                    panel.style.display === "block" ? "none" : "block";
                toggleBtn.textContent =
                    panel.style.display === "block" ? "Скрыть решение" : "Посмотреть решение";
            };

        } catch (err) {
            resultArea.innerHTML = `<p class="error-text">Ошибка: ${err}</p>`;
        }
    }

    /* --- Автоматическое выделение текста --- */
    function enableAutoSelect() {
        document.querySelectorAll("input[type='number']").forEach(input => {
            input.onfocus = () => input.select();
            input.ondblclick = () => input.select();
        });
    }

    generateMatrix("A");
    generateMatrix("B");
    enableAutoSelect();

</script>
</body>
</html>
