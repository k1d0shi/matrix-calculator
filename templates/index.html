<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Калькулятор матриц</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        /* Небольшие локальные стили для шага/аккордеона и кнопки решения */
        .result-container {
            width: 80%;
            margin: 20px auto;
            text-align: center;
        }
        .solution-toggle {
            display: inline-block;
            margin: 12px 0;
            cursor: pointer;
            color: #ffffff;
            background: #4CAF50;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: 600;
        }
        .solution-panel {
            width: 100%;
            max-width: 900px;
            margin: 10px auto 0;
            text-align: left;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
            display: none; /* скрыта по умолчанию */
            background: #fafafa;
        }
        .solution-panel ol {
            margin: 0;
            padding-left: 20px;
        }
        .solution-panel li {
            margin: 6px 0;
            line-height: 1.4;
        }
        .error-text {
            color: #c0392b;
            font-weight: 700;
            margin-top: 10px;
        }
        table.result-table {
            margin: 12px auto;
            border-collapse: collapse;
        }
        table.result-table td {
            border: 1px solid #444;
            padding: 8px 14px;
            font-size: 16px;
        }
    </style>
</head>
<body>
<header>
    <h1 style="font-size:48px; letter-spacing:4px; font-weight:800;">MATRIXa</h1>
</header>

<main>
    <div class="matrix-container" style="display: flex; justify-content: space-between; align-items: center; width: 80%; margin: 20px auto; position: relative;">
        <div class="matrix left-matrix">
            <h2>Матрица A</h2>
            <label>Размер:
                <select id="sizeA" onchange="generateMatrix('A')">
                    <option value="2">2x2</option>
                    <option value="3" selected>3x3</option>
                    <option value="4">4x4</option>
                </select>
            </label>
            <div id="matrixA"></div>
        </div>

        <button onclick="swapMatrices()" class="swap-button" style="position:absolute; left:50%; top:45%; transform:translate(-50%, -50%); font-size:30px; width:70px; height:70px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; padding:0;">
            🔁
        </button>

        <div class="matrix right-matrix">
            <h2>Матрица B</h2>
            <label>Размер:
                <select id="sizeB" onchange="generateMatrix('B')">
                    <option value="2">2x2</option>
                    <option value="3" selected>3x3</option>
                    <option value="4">4x4</option>
                </select>
            </label>
            <div id="matrixB"></div>
        </div>
    </div>

    <div class="operation" style="text-align:center; margin-top: 10px;">
        <label>Операция:
            <select id="operation">
                <option value="add">A + B (сложение)</option>
                <option value="sub">A - B (вычитание)</option>
                <option value="mul">A × B (умножение)</option>

                <option value="transposeA">Aᵀ (транспонирование A)</option>
                <option value="transposeB">Bᵀ (транспонирование B)</option>

                <option value="rankA">Ранг (A)</option>
                <option value="rankB">Ранг (B)</option>

                <option value="detA">det(A)</option>
                <option value="detB">det(B)</option>

                <option value="invA">A⁻¹ (обратная A)</option>
                <option value="invB">B⁻¹ (обратная B)</option>
            </select>
        </label>
        <button onclick="calculate()" class="gradient-btn">Вычислить</button>
    </div>


    <div id="resultArea" class="result-container" aria-live="polite"></div>
</main>

<script>

    function generateMatrix(id) {
        const size = parseInt(document.getElementById("size" + id).value);
        const container = document.getElementById("matrix" + id);
        container.innerHTML = "";
        for (let i = 0; i < size; i++) {
            const row = document.createElement("div");
            row.classList.add("row");
            for (let j = 0; j < size; j++) {
                const input = document.createElement("input");
                input.type = "number";
                input.value = "0";
                input.classList.add("cell");
                input.style.width = "60px";
                input.style.height = "36px";
                input.style.margin = "4px";
                input.style.textAlign = "center";
                row.appendChild(input);
            }
            container.appendChild(row);
        }
        enableAutoSelect();
    }


    function getMatrix(id) {
        const inputs = document.querySelectorAll(`#matrix${id} input`);
        const size = Math.sqrt(inputs.length);
        const matrix = [];
        for (let i = 0; i < size; i++) {
            const row = [];
            for (let j = 0; j < size; j++) {
                const value = parseFloat(inputs[i * size + j].value);
                row.push(isNaN(value) ? 0 : value);
            }
            matrix.push(row);
        }
        return matrix;
    }


    function swapMatrices() {
        const aInputs = document.querySelectorAll("#matrixA input");
        const bInputs = document.querySelectorAll("#matrixB input");
        if (aInputs.length !== bInputs.length) {
            alert("Матрицы должны быть одинакового размера!");
            return;
        }
        for (let i = 0; i < aInputs.length; i++) {
            const tmp = aInputs[i].value;
            aInputs[i].value = bInputs[i].value;
            bInputs[i].value = tmp;
        }

        const sa = document.getElementById("sizeA");
        const sb = document.getElementById("sizeB");
        const tv = sa.value;
        sa.value = sb.value;
        sb.value = tv;
    }


    async function calculate() {
        const A = getMatrix("A");
        const B = getMatrix("B");
        const operation = document.getElementById("operation").value;

        const resultArea = document.getElementById("resultArea");
        resultArea.innerHTML = "<p>Вычисляем...</p>";

        try {
            const response = await fetch("/calculate", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({A, B, operation})
            });

            const data = await response.json();
            if (data.error) {
                resultArea.innerHTML = `<p class="error-text">${data.error}</p>`;
                return;
            }

            let html = "";

            html += `<button id="toggleSolution" class="solution-toggle">Посмотреть решение</button>`;

            html += `<div id="resultBox">`;
            html += "<h3>Результат:</h3>";
            html += `<table class="result-table">`;
            data.result.forEach(row => {
                html += "<tr>";
                row.forEach(c => {
                    html += `<td>${c}</td>`;
                });
                html += "</tr>";
            });
            html += `</table>`;
            html += `</div>`;

            html += `<div id="solutionPanel" class="solution-panel"><h4>Пошаговое решение:</h4><ol>`;
            data.steps.forEach(step => {
                const safe = String(step).replace(/</g, "&lt;").replace(/>/g, "&gt;");
                html += `<li>${safe}</li>`;
            });
            html += `</ol></div>`;

            resultArea.innerHTML = html;

            // подключим toggle
            const toggleBtn = document.getElementById("toggleSolution");
            const panel = document.getElementById("solutionPanel");
            toggleBtn.addEventListener("click", function () {
                if (panel.style.display === "none" || panel.style.display === "") {
                    panel.style.display = "block";
                    toggleBtn.textContent = "Скрыть решение";
                    panel.scrollIntoView({behavior: "smooth", block: "start"});
                } else {
                    panel.style.display = "none";
                    toggleBtn.textContent = "Посмотреть решение";
                }
            });

        } catch (err) {
            resultArea.innerHTML = `<p class="error-text">Ошибка: ${err}</p>`;
        }
    }


    function enableAutoSelect() {
        document.querySelectorAll("input[type='number']").forEach(function (input) {
            input.onfocus = function () { this.select(); };
            input.ondblclick = function () { this.select(); };
        });
    }

    generateMatrix("A");
    generateMatrix("B");
    enableAutoSelect();
</script>
</body>
</html>
